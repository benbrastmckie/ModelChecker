name: Unstable Watch

# NON-GATING CONTRACT: this workflow observes `unstable`-marked tests (see
# code/pyproject.toml's marker registration and code/docs/core/TESTING_GUIDE.md
# section 8.9); it must NEVER gate anything. It must never appear in another
# workflow's `needs:`, and must never be added to branch protection required-checks.
# Triggers are deliberately limited to `schedule` and `workflow_dispatch` -- no
# `push`, no `pull_request`, no `tags`. This is the repository's first
# `schedule:`-triggered workflow.
on:
  schedule:
    # Nightly, chosen so the 20-consecutive-green promotion threshold (see
    # TESTING_GUIDE.md 8.9) is reachable in about 3 weeks. The job runs a single
    # test today, so the cost of nightly cadence is negligible.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unstable-watch:
    name: Observe unstable-marked tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          pip install z3-solver networkx pytest pytest-timeout typing-extensions

      - name: Run unstable-marked tests (code/ tree)
        id: watch_code
        continue-on-error: true
        run: |
          cd code
          set +e
          PYTHONPATH=src pytest tests/ src/model_checker -m unstable -v \
            --junitxml=/tmp/watch-code.xml
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit code 5 ("no tests collected") means this tree has no unstable-marked
          # test right now -- expected and not a failure. Any other non-zero code is a
          # genuine pytest-level problem (collection error, internal error, or a real
          # test failure) and is left for the classification step below to interpret.
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then
            exit 0
          fi
          exit "$code"

      - name: Run unstable-marked tests (oracle/ tree)
        id: watch_oracle
        continue-on-error: true
        run: |
          set +e
          # -o junit_logging=system-out: pytest's default JUnit XML does NOT embed a
          # captured print() inside <failure> at all -- it only appears in a sibling
          # <system-out> element, and only when junit_logging includes stdout (verified
          # empirically; default is "no"). TestGatingConclusiveScan's floor failure is
          # only distinguishable from a genuine disagreements failure via the
          # "disagreements=0" text _assert_scan_report unconditionally print()s before
          # either assertion -- .github/scripts/unstable_watch_classify.py's parse_junit
          # reads this sibling element and folds it into failure_text for exactly this
          # reason. Scoped to this step only: the code/ tree's BM_CM_1 signature needs no
          # system-out (its FAILURE_SIGNATURE lives directly in the assertion message).
          PYTHONPATH=code/src pytest oracle/bimodal_logic/tests/ -m unstable -v \
            -o junit_logging=system-out \
            --junitxml=/tmp/watch-oracle.xml
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit code 5 ("no tests collected") is the tolerated no-collection case --
          # e.g. before this tree carried its first unstable marking, or if a future
          # promotion ever brings the oracle tree's unstable set back to zero. Any
          # other non-zero code is a genuine pytest-level problem (collection error,
          # internal error, or a real test failure) and is left for the classification
          # step below to interpret.
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then
            exit 0
          fi
          exit "$code"

      - name: Run development-marked tests (bimodal blanket)
        id: watch_development
        continue-on-error: true
        run: |
          cd code
          set +e
          PYTHONPATH=src pytest tests/ src/model_checker -m development -v \
            --junitxml=/tmp/watch-development.xml
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit code 5 ("no tests collected") is tolerated for the same reason it is in
          # watch_code/watch_oracle above, but here it would only ever fire if bimodal's
          # theory-wide `development` blanket (code/src/model_checker/theory_lib/bimodal/
          # tests/conftest.py's pytest_collection_modifyitems hook) were removed without a
          # replacement marking left behind -- see code/docs/core/TESTING_GUIDE.md section
          # 8.14's "Exit path for this blanket" for that graduation trigger. Any other
          # non-zero code is a genuine pytest-level problem and is left for the
          # classification step below to interpret.
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then
            exit 0
          fi
          exit "$code"

      - name: Classify results and build the trend report
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/unstable_watch_classify.py

      - name: Upload per-run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unstable-watch-record-${{ github.run_id }}
          path: unstable-watch-record.jsonl
          if-no-files-found: warn
