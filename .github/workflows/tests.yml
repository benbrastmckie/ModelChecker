name: Tests

# Push/PR-triggered general regression gate. Runs code/tests/ and the in-package
# code/src/model_checker suite (PyPI z3-solver toolchain), plus a companion `nix flake check`
# job (nixpkgs-native z3 toolchain). This workflow is deliberately narrower in scope than
# code/tests/packaging/ (see .github/workflows/packaging.yml, which already covers that suite
# serially on every push/PR) and narrower in matrix than release.yml (see rationale below).
on:
  push:
    # `branches` is REQUIRED here, not decorative. A `push` trigger that specifies only tag
    # filters does not run on branch pushes at all -- adding `tags-ignore` alone silently
    # disabled this entire gate on every master push. Keep both lists: `branches` is what
    # makes branch pushes fire, `tags-ignore` is what keeps tag pushes out.
    branches:
      - '**'
    # Tag pushes are deliberately excluded: release.yml owns the v*.*.* tag event and
    # runs its own, wider (3-OS x 3-Python) `test-and-release` matrix before publishing.
    # Without this, a single tag push fired both workflows over the same commit --
    # duplicating the full suite, and surfacing contention-sensitive failures against a
    # release that release.yml had already tested green.
    tags-ignore:
      - '**'
    # Commits touching ONLY task-management artifacts cannot affect the package, but they
    # dominate this repository's master history: 23 of the 40 commits preceding v1.3.5 changed
    # nothing outside specs/**. Each one ran the full 3-Python matrix plus the flake-check job
    # for zero package signal -- and, because this suite carries contention-sensitive Z3 solve
    # budgets, each was an independent chance to surface a red X against a release that had
    # already published green. `/tag`'s own "record deployment in state.json" commit is exactly
    # this shape (9 lines of specs/state.json).
    #
    # Scoped deliberately narrowly. Only these two trees are unambiguously outside the package:
    # no test under code/ reads either (verified by grep over code/tests/ and
    # code/src/model_checker/). Markdown is NOT ignored here even though docs commits are
    # equally inert -- code/tests/packaging/test_inclusions.py, test_exclusions.py, and
    # theory_lib/tests/test_theory_conformance.py all assert on .md files' presence and
    # packaging, so a `**.md` entry would hide a real breakage.
    #
    # Applied to `push` only, NOT to `pull_request`. master is currently unprotected, but if
    # required status checks are ever enabled, a `paths-ignore`d check on a pull_request never
    # reports at all and blocks the merge indefinitely rather than passing. The push trigger has
    # no such failure mode, and it is where the 23-of-40 waste actually is.
    paths-ignore:
      - 'specs/**'
      - '.claude/**'
  pull_request:

jobs:
  general-tests:
    name: General Suite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # timeout-minutes left at 20 (not raised) when -n 6 became -n 4 below: the local
    # falsification screen's four full-selection draws (parallel pass only, "Run general test
    # suite" step's comment has the full rationale) showed no systematic -n 4 slowdown --
    # -n 6 averaged 260.4s, -n 4 averaged 272.8s, a ~5% difference well inside the ~70s
    # draw-to-draw spread, and the single fastest draw overall was actually an -n 4 draw. This
    # host's seconds do not extrapolate directly to the ubuntu-latest runner (see the same
    # comment's evidence-limitation note), but the *qualitative* absence of a large, systematic
    # slowdown is the basis for leaving the 20-minute backstop unchanged rather than an assumed
    # CI-side minute count.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install test dependencies
        run: |
          # typing-extensions: code/src/model_checker/theory_lib/logos/protocols.py imports
          # `from typing_extensions import runtime_checkable` at module level, but
          # typing_extensions is not declared in code/pyproject.toml's dependencies -- a
          # pre-existing undeclared-dependency gap in the package itself, out of scope to fix
          # here. Without it explicitly installed, test collection fails with a hard
          # ModuleNotFoundError rather than a skip (same class of gap as flake.nix's devPython
          # needing it, see flake.nix's own comment for that entry).
          pip install z3-solver networkx pytest pytest-xdist pytest-timeout ipywidgets matplotlib typing-extensions

      - name: Run general test suite
        working-directory: code
        env:
          PYTHONPATH: src
        run: |
          # -m "not packaging": code/tests/packaging/ builds a fresh wheel+sdist per session via
          # a session-scoped fixture in code/tests/packaging/conftest.py. Running it under xdist
          # parallelism is unsafe -- reproduced 86 spurious build-race errors (AssertionError:
          # build failed, "Backend subprocess exited when trying to invoke build_sdist") when
          # multiple workers built against the same source tree concurrently. That suite is
          # already covered serially, on every push/PR, by .github/workflows/packaging.yml and by
          # release.yml's build job -- do not remove this filter to "widen coverage"; it would
          # duplicate existing coverage and reintroduce the build race.
          #
          # -n 4, never xdist's auto worker-count mode: the theory_lib/bimodal suite has a
          # documented CPU-contention flake under that mode
          # (test_bimodal.py::test_example_cases[BM_CM_1-example_case7]). That case is now
          # `unstable`-marked (see code/pyproject.toml's marker registration and
          # code/docs/core/TESTING_GUIDE.md section 8.9) and deselected below via
          # `not unstable`; it is separately observed on its own by the non-gating
          # unstable-watch.yml workflow so it stays visible rather than silently dropped.
          # -n 4 is the value flake.nix's checks.default also uses, and this job deliberately does
          # NOT exclude bimodal even though `nix flake check` (see the flake-check job below) also
          # covers it: this job exercises the PyPI z3-solver wheel users actually install, while
          # the flake check exercises the nixpkgs-packaged Z3/Python toolchain -- deliberate
          # cross-toolchain coverage of the same tests, not redundant duplication.
          #
          # Changed from -n 6 to -n 4 on measured evidence, not a safety proof. A local
          # falsification screen (taskset -c 0,1,2,3, two draws each at -n 6 and -n 4 over the
          # full 2323-test gating selection) produced byte-identical PASSED/FAILED/ERROR node-id
          # outcomes across all four draws -- every cross-`-n` diff and every within-`-n` diff was
          # empty -- which corroborates an earlier, narrower 554-test measurement over just
          # bimodal/exclusion/imposition that found the same. This screen can only FALSIFY -n 4
          # (a node id changing outcome would have been decisive against it); it cannot PROVE
          # -n 4 is safe on the real CI runner. TESTING_GUIDE.md section 8.13 already records
          # that this exact `taskset -c 0-3`/`-n 6` command shape passes cleanly on a
          # core-restricted development host while the identical selection failed on real CI --
          # core-count restriction does not reproduce a per-core clock/IPC gap or a virtualized
          # neighbour, so this screen's clean result narrows risk without eliminating it.
          # Revert trigger (restore -n 6 in both this file and flake.nix, together, per
          # code/tests/ci/test_workflow_parity.py::test_worker_count_matches): the first CI run
          # in which a countermodel-expected example stops finding a countermodel, or a new
          # contention-shaped failure appears (timeout, worker death, "Model result did not
          # match expectation value in settings" against an example with ample measured
          # headroom).
          # --timeout=300 --timeout-method=thread: pytest-timeout's default `signal` method
          # cannot interrupt or diagnose a hang blocked inside a C extension call such as a stuck
          # Z3 solve -- `thread` instead runs a watcher thread that dumps every thread's stack via
          # `faulthandler` regardless of where execution is blocked. Motivating incident: CI run
          # 32897405646's Python 3.12 job reached 94% progress, produced zero output for 17
          # minutes, and was killed by the job-level `timeout-minutes: 20` backstop with no
          # indication of which test had hung -- only orphaned pytest and worker processes in the
          # cleanup log. 300s sits far below that 20-minute backstop (so the per-test timeout
          # fires first and actually produces the diagnostic) and comfortably above the slowest
          # single test measured locally under this same `-n 6` selection (82.34s,
          # TestBimodalIteratorReal::test_iterate_two_produces_distinct_models). Prior in-repo
          # precedent for this exact `--timeout=N --timeout-method=thread` invocation shape:
          # specs/archive/129_triage_preexisting_test_failure_backlog/plans/01_verify-fixes-baseline-doc.md
          # (lines 134, 143, 359).
          #
          # Two-pass split, mirroring oracle/run-oracle-suite.sh's parallel/serial structure:
          # the `-n 6` pass excludes `xdist_serial` (see code/pyproject.toml's marker
          # registration and code/docs/core/TESTING_GUIDE.md's marker taxonomy) -- tests with a
          # real wall-clock assertion that CPU contention under a shared `-n` worker pool can
          # push past budget -- and a second, serial pass (no `-n` flag) runs exactly those
          # tests instead, so they keep gating coverage without the contention that made them
          # flake.
          #
          # Peak-RSS-per-worker telemetry on EVERY Python leg (item D instrumentation; see
          # `.github/scripts/worker_rss_sample.py`'s module docstring for the full contract).
          # D's root cause is OPEN -- this does not fix or diagnose it, only makes the memory
          # hypothesis checkable against data instead of log archaeology. Three live hypotheses:
          # (1) memory exhaustion on the runner, (2) a Z3/z3-solver ABI fault unrelated to
          # memory, (3) an xdist/execnet worker-communication fault under load.
          #
          # NOT matrix-gated, and deliberately so. This step was originally scoped to 3.12 as
          # "the only leg the crash has been observed on". CI run 32996446859 falsified that:
          # `[gw2] node down: Not properly terminated` occurred on Python 3.11, and the
          # 3.12 gate meant the sampler collected NOTHING for that incident. Telemetry gated to
          # a subset of legs cannot observe a failure whose leg distribution is the open
          # question. `code/tests/ci/test_worker_rss_sampler.py::TestSamplerIsNotMatrixGated`
          # keeps this ungated executably. Hypothesis (2) is correspondingly weakened: the
          # crash is not Python-3.12-specific.
          #
          # Deliberately non-gating: the sampler runs in the background alongside the parallel
          # pass and its own failure (`|| true`) can never turn a green suite red; only the
          # final `wait` on pytest's own PID determines this step's exit status, exactly as a
          # plain foreground `pytest ...` invocation would. Removable in one piece once the
          # hypothesis resolves: delete this file, its test module
          # (`code/tests/ci/test_worker_rss_sampler.py`), and this conditional block.
          #
          # The parallel-pass `pytest ...` invocation below is backgrounded unconditionally
          # so this file keeps exactly one literal copy of that line --
          # code/tests/ci/test_workflow_parity.py's extraction regex requires exactly one
          # parallel-pass `pytest` line per file, and a python-version-conditional *duplicate*
          # of the line (one copy per branch) would silently break that guard's "found 2"
          # assertion. Backgrounding-then-`wait`ing is behaviorally identical to a foreground
          # invocation; the sampler simply attaches to the backgrounded PID. Keeping exactly
          # one literal copy of the pytest line remains required by that guard.
          pytest tests/ src/model_checker -m "not packaging and not performance and not unstable and not xdist_serial and not development" -n 4 -q --timeout=300 --timeout-method=thread &
          PYTEST_PID=$!
          python3 ../.github/scripts/worker_rss_sample.py --root-pid "$PYTEST_PID" --workers 4 --interval 2 --output /tmp/worker-rss-summary.json || true
          wait "$PYTEST_PID"
          pytest tests/ src/model_checker -m "xdist_serial and not packaging and not unstable and not development" -q --timeout=300 --timeout-method=thread

  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    # Estimate only, not yet observed on a cold GitHub Actions runner: a warm-cache local run of
    # `nix flake check` on this repo takes ~2.5 min (measured, see
    # specs/150_add_general_ci_workflow_and_flake_check_gate/reports/01_ci-workflow-and-flake-gate.md).
    # A cold runner additionally pays for fetching/building the nixpkgs python312 + z3-solver +
    # networkx + pytest closures, which is unbounded until observed -- hence the generous timeout.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Run nix flake check
        run: nix flake check
