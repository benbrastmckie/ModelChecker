name: Release

# Trigger on version tags for ALL releases - major, minor, and patch
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # v1.0.0, v1.2.3, v1.0.1, etc.
  # Manual dispatch, run against the tag being released, so the skip_testpypi escape hatch
  # below is reachable only by deliberate human action -- never implicitly from a plain
  # `git push --tags`. Intended for the rare case where TestPyPI itself is known-broken
  # (e.g. an outage) and a release must proceed without the rehearsal gate.
  workflow_dispatch:
    inputs:
      skip_testpypi:
        description: >-
          Skip the TestPyPI rehearsal gate and publish straight to PyPI. Only use this when
          TestPyPI itself is unavailable -- it removes the "installable and importable" proof
          this workflow otherwise requires before a production publish.
        type: boolean
        default: false

# Default permissions are read-only; each job below grants only what it needs
# (id-token: write for OIDC-based PyPI publishing, contents: write for the
# GitHub Release step). See .github/RELEASE_SETUP.md for the Trusted
# Publishing (OIDC) setup this relies on.
permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (tag/version/CHANGELOG checks)
    needs: []
    runs-on: ubuntu-latest
    # Seconds-cheap: fails fast on a tag/source-of-truth mismatch before the 9-job matrix and
    # the build run start. No matrix, no dependencies.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Full history and tags are required by both the CHANGELOG-vs-git-history reasoning
        # below and the tag-ancestry / workflow-file-match checks, which diff the tagged
        # commit against origin/master.
        fetch-depth: 0

    - name: Assert tag version matches code/pyproject.toml
      shell: bash
      run: |
        set -uo pipefail
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PYPROJECT_VERSION=$(grep -m1 '^version = ' code/pyproject.toml | sed -E 's/version = "(.*)"/\1/')

        # Exactly two independent version literals exist: the tag and code/pyproject.toml.
        # flake.nix derives its version from the same TOML file via builtins.fromTOML (see
        # flake.nix's own comment above that line) and so cannot drift from it by construction
        # -- a third check here would be redundant, not defense in depth.
        if [ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ]; then
          echo "ERROR: tag version (${TAG_VERSION}) does not match code/pyproject.toml's" \
               "version (${PYPROJECT_VERSION})"
          exit 1
        fi
        echo "✓ tag version ${TAG_VERSION} matches code/pyproject.toml"

    - name: Assert CHANGELOG.md has a non-empty entry for this version
      shell: bash
      run: |
        set -uo pipefail
        VERSION="${GITHUB_REF_NAME#v}"
        CHANGELOG=code/CHANGELOG.md

        if ! grep -q "^## \[${VERSION}\]" "${CHANGELOG}"; then
          echo "ERROR: ${CHANGELOG} has no '## [${VERSION}]' heading. Add a CHANGELOG entry" \
               "for ${VERSION} before tagging -- see .github/RELEASE_SETUP.md."
          exit 1
        fi

        SECTION=$(awk -v ver="${VERSION}" '
          $0 ~ "^## \\[" ver "\\]" { found=1; next }
          found && /^## / { exit }
          found { print }
        ' "${CHANGELOG}")

        if [ -z "$(printf '%s' "${SECTION}" | tr -d '[:space:]')" ]; then
          echo "ERROR: ${CHANGELOG}'s '## [${VERSION}]' entry is empty. Add release notes for" \
               "${VERSION} before tagging -- see .github/RELEASE_SETUP.md."
          exit 1
        fi
        echo "✓ ${CHANGELOG} has a non-empty entry for ${VERSION}"

    - name: Assert the tag is annotated and reachable from origin/master
      shell: bash
      run: |
        set -uo pipefail

        # Re-fetch the tag ref before inspecting it. actions/checkout@v4 DESTROYS the
        # annotation: after its initial `+refs/tags/*:refs/tags/*` fetch, it runs a second
        # `git fetch --no-tags ... origin +<commit-sha>:refs/tags/<tag>` that re-points the
        # local ref straight at the dereferenced commit. `git cat-file -t` in the workspace
        # therefore reports "commit" for EVERY tag, annotated or not, and this check could
        # never pass as originally written -- it rejected correctly-annotated tags. Observed
        # on CI run 33502746641, whose own checkout log shows that clobbering fetch while the
        # remote ref was a genuine tag object. Fetching the ref itself (not the SHA) restores
        # the real object, and the check keeps its meaning: a genuinely lightweight remote tag
        # still resolves to a commit here and still fails.
        git fetch origin --force "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

        TAG_TYPE=$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")
        if [ "${TAG_TYPE}" != "tag" ]; then
          echo "ERROR: ${GITHUB_REF_NAME} is a ${TAG_TYPE}, not an annotated tag. Create it" \
               "with 'git tag -a' (or -s), not 'git tag'."
          exit 1
        fi

        if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}" origin/master; then
          echo "ERROR: ${GITHUB_REF_NAME} is not reachable from origin/master. Push (or" \
               "/merge) the branch BEFORE creating and pushing the tag -- see" \
               ".github/RELEASE_SETUP.md."
          exit 1
        fi
        echo "✓ ${GITHUB_REF_NAME} is an annotated tag reachable from origin/master"

    - name: Assert the tagged release.yml matches origin/master's copy
      shell: bash
      # Mechanical backstop for the workflow-file-ordering hazard documented in
      # .github/RELEASE_SETUP.md: Actions executes this workflow file as it exists AT THE
      # TAGGED COMMIT, not as it exists on the default branch. fetch-depth: 0 above already
      # gives this job full history, so this is a low-incremental-cost addition to the same
      # job rather than a new one.
      run: |
        set -uo pipefail
        if ! git diff --quiet "${GITHUB_REF_NAME}" origin/master -- .github/workflows/release.yml; then
          echo "ERROR: .github/workflows/release.yml at ${GITHUB_REF_NAME} differs from" \
               "origin/master's copy. Push (or /merge) the branch with the workflow change" \
               "BEFORE creating and pushing the tag -- see .github/RELEASE_SETUP.md."
          exit 1
        fi
        echo "✓ .github/workflows/release.yml at ${GITHUB_REF_NAME} matches origin/master"

  test-and-release:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: preflight
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true  # Stop immediately if any test fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']  # Matches requires-python floor in pyproject.toml

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Get version from tag
      id: version
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install and test package
      shell: bash
      # This job deliberately runs NO pytest suite -- it only builds the wheel, installs
      # it, and smoke-tests import/CLI/version match below. There is therefore no `-m`
      # expression here for BM_CM_1's `unstable` marker (see code/pyproject.toml and
      # code/docs/core/TESTING_GUIDE.md section 8.9) to gate a release from. Any pytest
      # suite added to this job in the future MUST carry `not unstable` in its `-m`
      # expression, mirroring tests.yml and differential-tests.yml, so this job cannot
      # become a silent gate on a quarantined test.
      run: |
        cd code

        # Install build dependencies
        python -m pip install --upgrade pip
        pip install build wheel setuptools

        # Build the package
        python -m build
        ls -la dist/

        # Install the built wheel
        WHEEL_FILE=$(ls dist/*.whl | head -1)
        echo "Installing wheel: $WHEEL_FILE"
        pip install "$WHEEL_FILE"

        # Test basic import
        python -c "import model_checker; print(f'Version: {model_checker.__version__}')"

        # Test CLI availability
        python -m model_checker --help

        # Verify version matches tag
        INSTALLED_VERSION=$(python -c "import model_checker; print(model_checker.__version__)")
        TAG_VERSION="${{ steps.version.outputs.version }}"

        if [ "$INSTALLED_VERSION" != "$TAG_VERSION" ]; then
          echo "ERROR: Installed version ($INSTALLED_VERSION) doesn't match tag ($TAG_VERSION)"
          exit 1
        fi

        echo "✓ All basic tests passed"

  build:
    name: Build distribution
    needs: test-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build package
      run: |
        cd code
        python -m pip install --upgrade pip
        pip install build twine wheel
        python -m build
        ls -la dist/

    - name: Check package with twine
      run: |
        cd code
        twine check --strict dist/*

    - name: Run packaging contract tests
      # Additive, non-publish-affecting check: contents-verifies this same revision's wheel/sdist
      # (rebuilt fresh into a pytest temp dir by the suite itself -- it never reads code/dist/)
      # before the artifact below is uploaded and eventually published.
      #
      # "and not unstable" is a defensive no-op today (no packaging test is or should be
      # `unstable`) -- it makes this real pytest invocation on the release-gating path
      # structurally incapable of gating on a quarantined test, matching tests.yml and
      # differential-tests.yml, even though nothing here currently needs the exclusion.
      run: |
        cd code
        pip install pytest
        python -m pytest tests/packaging/ -v -m "packaging and not unstable and not development"

    - name: Upload distribution artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: code/dist/
        if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [test-and-release, build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # Required for OIDC Trusted Publishing
    # Hard gate: a failure here blocks the production PyPI publish below (publish-pypi
    # now needs verify-testpypi, which needs this job -- see that job for the chain). The
    # only sanctioned bypass is the workflow_dispatch `skip_testpypi` input, which must be
    # set deliberately by a human; it is never true under the normal `push: tags:` trigger.
    # See .github/RELEASE_SETUP.md for the Trusted Publishing (OIDC) setup this relies on.
    #
    # NOTE: a job-level `if:` REPLACES the implicit `if: success()` default GitHub Actions
    # applies to every job that declares `needs:` -- it does not layer on top of it. Writing
    # only `${{ inputs.skip_testpypi != true }}` here would let this job attempt to run even
    # after test-and-release/build failed, since that expression never inspects their result.
    # `success()` is included explicitly to preserve the standard fail-fast chain.
    if: ${{ success() && inputs.skip_testpypi != true }}

    steps:
    # Diagnostic only -- never a gate. Prints the OIDC claims test.pypi.org
    # matches a trusted publisher against, so an `invalid-publisher` rejection
    # is readable at a glance instead of by expanding the upload step's log.
    # Mirrors the claim vocabulary and "debugging purposes only" framing of
    # pypa/gh-action-pypi-publish's own oidc-exchange.py.
    #
    # SECURITY: ACTIONS_ID_TOKEN_REQUEST_TOKEN and the minted JWT are generated
    # at runtime and are NOT covered by GitHub's automatic secret masking. The
    # jq whitelist below is the only thing keeping them out of the log: neither
    # value is ever echoed, and neither is written to $GITHUB_OUTPUT,
    # $GITHUB_ENV, or an artifact.
    - name: Print OIDC claims (diagnostic only)
      continue-on-error: true
      env:
        # Kept in sync with the `repository-url` of the publish step below.
        OIDC_HOST: test.pypi.org
      run: |
        set -euo pipefail
        AUDIENCE="$(curl -sS "https://${OIDC_HOST}/_/oidc/audience" \
          | jq -r '.audience' || echo '')"
        if [ -z "${AUDIENCE}" ] || [ "${AUDIENCE}" = "null" ]; then
          AUDIENCE=testpypi
        fi
        echo "OIDC audience: ${AUDIENCE}"
        JWT="$(curl -sS \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
          | jq -r '.value')"
        PAYLOAD="$(printf '%s' "${JWT}" | cut -d. -f2 | tr '_-' '/+')"
        while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
        echo "The claims below are for debugging purposes only. Do not use them"
        echo "to configure a trusted publisher unless they already match your"
        echo "expectations."
        printf '%s' "${PAYLOAD}" | base64 -d \
          | jq '{sub, repository, workflow_ref, environment}'

    - name: Download distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  verify-testpypi:
    name: Verify TestPyPI install
    needs: [test-and-release, build, publish-testpypi]
    runs-on: ubuntu-latest
    # This job's own if: replaces the implicit if: success() default (see the note on
    # publish-testpypi's if: above), so the upstream success check is spelled out explicitly
    # here rather than relied on implicitly.
    #
    # Runs when either (a) publish-testpypi actually published (the normal path -- install and
    # smoke-test what was just uploaded), or (b) publish-testpypi was itself skipped because a
    # human set the skip_testpypi escape hatch (nothing was uploaded, so there is nothing to
    # verify; the steps below no-op via their own per-step `if:` so this job still reports
    # success and does not block publish-pypi). If publish-testpypi genuinely failed, or
    # test-and-release/build failed, none of these disjuncts hold and this job is skipped,
    # which correctly blocks publish-pypi below via its own default if: success() check.
    if: >-
      ${{ always() && needs.test-and-release.result == 'success' &&
          needs.build.result == 'success' &&
          (needs.publish-testpypi.result == 'success' ||
           (needs.publish-testpypi.result == 'skipped' && inputs.skip_testpypi == true)) }}

    steps:
    - name: Get version from tag
      id: version
      if: ${{ inputs.skip_testpypi != true }}
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install from TestPyPI (retry for index propagation lag)
      if: ${{ inputs.skip_testpypi != true }}
      shell: bash
      run: |
        set -uo pipefail
        VERSION="${{ steps.version.outputs.version }}"

        # Both indexes are required: TestPyPI does not mirror dependencies (z3-solver would
        # otherwise fail to resolve), so PyPI proper is the extra index for everything except
        # the package under test. Pinned to the exact tag version: test.pypi.org still carries
        # a stale 0.1 release from a pre-CI manual upload, so a bare/unpinned install would
        # silently resolve that instead of the artifact this run just published.
        success=0
        for i in $(seq 1 10); do
          if pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "model-checker==${VERSION}"; then
            success=1
            break
          fi
          echo "Install attempt ${i}/10 failed (TestPyPI index propagation lag); retrying in 15s..."
          sleep 15
        done

        if [ "${success}" -ne 1 ]; then
          echo "ERROR: failed to install model-checker==${VERSION} from TestPyPI after 10 attempts"
          exit 1
        fi

    - name: Smoke test the installed artifact
      if: ${{ inputs.skip_testpypi != true }}
      shell: bash
      run: |
        set -uo pipefail
        VERSION="${{ steps.version.outputs.version }}"

        INSTALLED_VERSION=$(python -c "import model_checker; print(model_checker.__version__)")
        if [ "${INSTALLED_VERSION}" != "${VERSION}" ]; then
          echo "ERROR: TestPyPI-installed version (${INSTALLED_VERSION}) doesn't match tag (${VERSION})"
          exit 1
        fi

        python -m model_checker --help

        echo "✓ TestPyPI artifact installed and importable (version ${INSTALLED_VERSION})"

  publish-pypi:
    name: Publish to PyPI
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for OIDC Trusted Publishing

    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  verify-pypi:
    name: Verify PyPI install (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: [publish-pypi]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Why this job exists: before this, nothing verified the artifact that publish-pypi just
    # published to production PyPI -- verify-testpypi (above) only ever confirmed the TestPyPI
    # rehearsal upload, on a single OS. This job runs the same code/tests/packaging/ suite that
    # Phases 1-3 of this task parameterized over install source, against the real PyPI-published
    # release, across the same 3x3 OS/Python matrix test-and-release already uses -- rather than
    # a fourth hand-rolled shell smoke script (see the retry-loop/index-mode logic centralized
    # in code/tests/packaging/conftest.py's installed_venv fixture instead of duplicated here).
    # Cost: 9 post-publish legs per release, only on the v*.*.* tag path (zero added cost per
    # push -- packaging.yml and release.yml's build job are unaffected by this job).
    strategy:
      fail-fast: false  # one leg's failure should not hide the other 8 legs' signal
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']  # matches test-and-release's matrix

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install packaging test dependencies
      run: pip install pytest build wheel

    - name: Run packaging contract tests against the published PyPI artifact
      # MODEL_CHECKER_PACKAGING_INSTALL_SOURCE=pypi with MODEL_CHECKER_PACKAGING_INSTALL_VERSION
      # left unset resolves to the exact version parsed from code/pyproject.toml (D2.1 of the
      # task's plan) -- correct on this tag path, where that version was just published above.
      # "and not unstable" matches build's own invocation (D7) so this release-gating path can
      # never gate on a quarantined test.
      shell: bash
      env:
        MODEL_CHECKER_PACKAGING_INSTALL_SOURCE: pypi
      run: |
        cd code
        python -m pytest tests/packaging/ -v -m "packaging and not unstable and not development"

  github-release:
    name: Create GitHub Release
    needs: [publish-pypi, verify-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create releases

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ github.ref_name }}"

        # Create release notes
        RELEASE_NOTES="## ModelChecker ${VERSION}

        ### Installation
        \`\`\`bash
        pip install model-checker==${VERSION#v}
        \`\`\`

        ### What's Changed
        See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/code/CHANGELOG.md) for details."

        # Check if release already exists
        if gh release view "${VERSION}" > /dev/null 2>&1; then
          echo "Release ${VERSION} already exists, skipping creation"
        else
          # Create the release using GitHub CLI
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes "${RELEASE_NOTES}" \
            --verify-tag
        fi
