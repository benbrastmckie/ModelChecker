name: Release

# Trigger on version tags for ALL releases - major, minor, and patch
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # v1.0.0, v1.2.3, v1.0.1, etc.

# Default permissions are read-only; each job below grants only what it needs
# (id-token: write for OIDC-based PyPI publishing, contents: write for the
# GitHub Release step). See .github/RELEASE_SETUP.md for the Trusted
# Publishing (OIDC) setup this relies on.
permissions:
  contents: read

jobs:
  test-and-release:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true  # Stop immediately if any test fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.12']  # Test min and max Python versions

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Get version from tag
      id: version
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install and test package
      shell: bash
      run: |
        cd code

        # Install build dependencies
        python -m pip install --upgrade pip
        pip install build wheel setuptools

        # Build the package
        python -m build
        ls -la dist/

        # Install the built wheel
        WHEEL_FILE=$(ls dist/*.whl | head -1)
        echo "Installing wheel: $WHEEL_FILE"
        pip install "$WHEEL_FILE"

        # Test basic import
        python -c "import model_checker; print(f'Version: {model_checker.__version__}')"

        # Test CLI availability
        python -m model_checker --help

        # Verify version matches tag
        INSTALLED_VERSION=$(python -c "import model_checker; print(model_checker.__version__)")
        TAG_VERSION="${{ steps.version.outputs.version }}"

        if [ "$INSTALLED_VERSION" != "$TAG_VERSION" ]; then
          echo "ERROR: Installed version ($INSTALLED_VERSION) doesn't match tag ($TAG_VERSION)"
          exit 1
        fi

        echo "✓ All basic tests passed"

  build:
    name: Build distribution
    needs: test-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build package
      run: |
        cd code
        python -m pip install --upgrade pip
        pip install build twine
        python -m build
        ls -la dist/

    - name: Check package with twine
      run: |
        cd code
        twine check --strict dist/*

    - name: Upload distribution artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: code/dist/
        if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [test-and-release, build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # Required for OIDC Trusted Publishing
    # Non-fatal: this job is a rehearsal step. It is skipped/failed softly if
    # the TestPyPI trusted publisher + "testpypi" GitHub Environment are not
    # yet configured (see .github/RELEASE_SETUP.md), so an unconfigured
    # TestPyPI rehearsal never blocks the production PyPI publish below.
    continue-on-error: true

    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for OIDC Trusted Publishing

    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create releases

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ github.ref_name }}"

        # Create release notes
        RELEASE_NOTES="## ModelChecker ${VERSION}

        ### Installation
        \`\`\`bash
        pip install model-checker==${VERSION#v}
        \`\`\`

        ### What's Changed
        See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/code/CHANGELOG.md) for details."

        # Check if release already exists
        if gh release view "${VERSION}" > /dev/null 2>&1; then
          echo "Release ${VERSION} already exists, skipping creation"
        else
          # Create the release using GitHub CLI
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes "${RELEASE_NOTES}" \
            --verify-tag
        fi
