name: Differential Oracle Tests

on:
  workflow_dispatch:
  push:
    # `branches` is REQUIRED here, not decorative -- a `push` trigger specifying only tag
    # filters never fires on branch pushes. See the fuller note in tests.yml. `branches`
    # and `paths` below are ANDed, which is the intended behaviour: a branch push runs this
    # suite only when it touches one of the oracle/bimodal paths.
    branches:
      - '**'
    # Tag pushes are deliberately excluded. GitHub does not apply the `paths` filter below
    # to a tag push, so without this the full ~12-minute cross-oracle suite ran on every
    # release tag regardless of whether any bimodal or oracle file changed. The oracle
    # tree is excluded from the wheel entirely, so it has no bearing on a release.
    tags-ignore:
      - '**'
    paths:
      - 'oracle/bimodal_logic/**'
      - 'code/src/model_checker/theory_lib/bimodal/**'
  pull_request:
    paths:
      - 'oracle/bimodal_logic/**'
      - 'code/src/model_checker/theory_lib/bimodal/**'

jobs:
  differential-tests:
    name: Cross-Oracle Differential Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install bimodal-logic package with dependencies
        run: pip install -e code/ pytest pytest-timeout

      - name: Run differential tests (non-slow, no BimodalHarness)
        run: |
          # --timeout=1500 (widened from 900, 2026-08-12): TestGatingConclusiveScan
          # ::test_known_conclusive_population_self_consistent is xdist_serial (it
          # already runs alone, so this is a genuine budget-too-tight issue rather
          # than worker contention), does real re-solving work, and is deliberately
          # unmarked (not @pytest.mark.slow) so it runs every gating pass; its
          # observed runtime was ~620s at the old 20s-per-formula budget with 7-8
          # formulas timing out. GATING_RECHECK_SOLVE_TIMEOUT_MS was widened
          # 20000 -> 40000ms in test_cross_oracle_differential.py (see that
          # constant's own comment for the full justification) to close a real CI
          # conclusive-population shortfall; at 40s those same 7-8 timeouts add
          # roughly another 140-160s, landing near ~780s against the OLD 900s cap
          # -- only ~13% headroom, too thin, since a suite timeout here would
          # destroy the very countable evidence this test exists to produce. 1500
          # restores comfortable headroom over that ~780s estimate.
          PYTHONPATH=code/src pytest \
            oracle/bimodal_logic/tests/test_cross_oracle_differential.py \
            -v \
            -m "not slow and not differential and not unstable" \
            --timeout=1500
        env:
          PYTHONPATH: code/src

      - name: Run CI gate tests explicitly
        run: |
          PYTHONPATH=code/src pytest \
            oracle/bimodal_logic/tests/test_cross_oracle_differential.py::TestCIGate \
            oracle/bimodal_logic/tests/test_cross_oracle_differential.py::TestFormulaEnumerator \
            oracle/bimodal_logic/tests/test_cross_oracle_differential.py::TestDifferentialInfrastructure \
            oracle/bimodal_logic/tests/test_cross_oracle_differential.py::TestKnownFormulaBaseline \
            oracle/bimodal_logic/tests/test_cross_oracle_differential.py::TestDifferentialComparison \
            oracle/bimodal_logic/tests/test_cross_oracle_differential.py::TestDifferentialReport \
            -v \
            --timeout=300
        env:
          PYTHONPATH: code/src
