[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-checker"
# Version reset for the post-oracle-relocation restoration; the release task (parent 117)
# confirms the final published number.
version = "1.3.0"
description = "A hyperintensional theorem prover for developing and exploring programmatic semantic theories."
authors = [
    { name = "Benjamin Brast-McKie", email = "benbrastmckie@gmail.com" },
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["semantics", "Z3", "SMT", "logic", "modal logic", "counterfactuals", "modality", "model checking", "theorem prover", "hyperintensionality"]
dependencies = [
    "z3-solver>=4.8.0",  # Core dependency for constraint solving
    "networkx>=2.0",     # For graph representation of models (model_checker.iterate.graph)
]
requires-python = ">=3.10"

[project.optional-dependencies]
jupyter = [
    "ipywidgets>=7.0.0",  # For interactive notebook components
    "matplotlib>=3.0.0",  # For visualization of models
    "networkx>=2.0",      # For graph representation of models
    "jupyter",            # For notebook environment
    "ipython",            # For interactive features
]
all = [
    "ipywidgets>=7.0.0",
    "matplotlib>=3.0.0",
    "networkx>=2.0",
    "jupyter",
    "ipython",
]
dev = [
    "pytest-xdist>=3.0.0",  # Parallel test execution: pytest -n auto
]

[project.urls]
Homepage = "https://github.com/benbrastmckie/ModelChecker"
Issues = "https://github.com/benbrastmckie/ModelChecker/issues"

[project.scripts]
model-checker = "model_checker.__main__:run"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Explicit allowlist, not a blanket "*.md" -- a bare "*.md" glob sweeps in any markdown file
# that happens to sit in a package directory (TODO.md, history/*.md, reports/*.md), regardless
# of whether it is an intentional, contract-conforming doc. See
# theory_lib/docs/THEORY_ARCHITECTURE.md's Theory Contract for the doc file set this mirrors:
# root-level README.md/CITATION.md/LICENSE.md/VERSION, the six-file docs/ set, and notebooks/.
"*" = [
    "README.md",
    "CITATION.md",
    "LICENSE.md",
    "VERSION",
    "docs/*.md",
    "notebooks/*.ipynb",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests", "src/model_checker"]
python_files = "test_*.py"
python_classes = "Test*"
# TEMPORARY: -m "not slow" is a quarantine, not a settled policy. It is here
# because two defects currently make an unfiltered run unusable rather than
# merely slow:
#
#   1. Concurrent model building segfaults the interpreter (exit 139, faulting
#      extension cvc5.cvc5_python_base), which aborts the whole run with no
#      failure summary at all. Reproduces intermittently -- 1 of 3 identical
#      isolated invocations.
#   2. Several wall-clock assertions have budgets tighter than this codebase's
#      real Z3 solve-time variance (see docs/core/TESTING_GUIDE.md 8.6), so
#      their pass/fail state changes between identical runs on the same commit.
#
# Both are tracked and both must be FIXED, not left filtered. Remove this
# filter -- do not merely relax it -- once they are, and confirm an
# unfiltered run is green and repeatable. Measured at the time of writing:
# filtered 1 failure / 2136 passed / 43 deselected in 5:37; unfiltered
# 5 failures / 2173 passed in 6:36 with a differing failure set run to run.
#
# Run the quarantined tests explicitly with: pytest -m slow
addopts = "--durations=0 -v --import-mode=importlib -m \"not slow\""
markers = [
    "countermodel: Tests that verify a countermodel exists",
    "theorem: Tests that verify a formula is a theorem",
    "performance: Tests that verify performance characteristics",
    "differential: Tests that compare MC oracle against reference oracles",
    "slow: Quarantined pending fixes (see the addopts note above) -- NOT a permanent opt-out; these tests are expected to rejoin the default run",
]
filterwarnings = [
    # Ignore deprecation warning from z3's use of pkg_resources
    # This is a third-party library issue that will be fixed upstream
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning:z3.z3core",
    # Also ignore if it comes without specific module attribution
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]
