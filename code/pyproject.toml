[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-checker"
# Single source of truth for the published version: `model_checker.__version__` reads it back
# from installed package metadata rather than redeclaring it. release.yml asserts this value
# matches the pushed v*.*.* tag and fails the release if it does not -- so bump this in the
# same commit that precedes the tag, never after.
version = "1.3.9"
description = "A hyperintensional theorem prover for developing and exploring programmatic semantic theories."
authors = [
    { name = "Benjamin Brast-McKie", email = "benbrastmckie@gmail.com" },
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["semantics", "Z3", "SMT", "logic", "modal logic", "counterfactuals", "modality", "model checking", "theorem prover", "hyperintensionality"]
dependencies = [
    "z3-solver>=4.8.0",  # Core dependency for constraint solving
    "networkx>=2.0",     # For graph representation of models (model_checker.iterate.graph)
]
requires-python = ">=3.10"

[project.optional-dependencies]
jupyter = [
    "ipywidgets>=7.0.0",  # For interactive notebook components
    "matplotlib>=3.0.0",  # For visualization of models
    "networkx>=2.0",      # For graph representation of models
    "jupyter",            # For notebook environment
    "ipython",            # For interactive features
]
all = [
    "ipywidgets>=7.0.0",
    "matplotlib>=3.0.0",
    "networkx>=2.0",
    "jupyter",
    "ipython",
]
dev = [
    "pytest-xdist>=3.0.0",    # Parallel test execution: pytest -n auto
    "pytest-timeout>=2.0.0",  # @pytest.mark.timeout(...) hang guards in tests/integration/
]

[project.urls]
Homepage = "https://github.com/benbrastmckie/ModelChecker"
Issues = "https://github.com/benbrastmckie/ModelChecker/issues"

[project.scripts]
model-checker = "model_checker.__main__:run"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Explicit allowlist, not a blanket "*.md" -- a bare "*.md" glob sweeps in any markdown file
# that happens to sit in a package directory (TODO.md, history/*.md, reports/*.md), regardless
# of whether it is an intentional, contract-conforming doc. See
# theory_lib/docs/THEORY_ARCHITECTURE.md's Theory Contract for the doc file set this mirrors:
# root-level README.md/CITATION.md/LICENSE.md, the six-file docs/ set, and notebooks/.
"*" = [
    "README.md",
    "CITATION.md",
    "LICENSE.md",
    "docs/*.md",
    "notebooks/*.ipynb",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests", "src/model_checker"]
python_files = "test_*.py"
python_classes = "Test*"
addopts = "--durations=0 -v --import-mode=importlib"
markers = [
    "countermodel: Tests that verify a countermodel exists",
    "theorem: Tests that verify a formula is a theorem",
    "performance: Tests that verify performance characteristics",
    "differential: Tests that compare MC oracle against reference oracles",
    "slow: Genuinely expensive tests (large allocations or long solves). These run in the default suite; deselect them with `-m \"not slow\"` for a faster local iteration loop",
    "packaging: Tests that build and inspect wheel/sdist artifacts -- slower than unit tests, requires a build toolchain",
    "unstable: Tests with a documented, investigated non-semantic instability (e.g. a heavy-tailed solver draw). Deselected from release-gating runs with `-m \"not unstable\"`; run on their own by the unstable-watch workflow so they stay observed rather than forgotten.",
    "xdist_serial: Tests with a real wall-clock timing assertion that has adequate headroom under normal conditions, but which CPU contention under pytest-xdist's -n worker pool can push past budget. Deselected from the parallel `-n` pass; run in a serial second CI pass with no `-n` flag instead (see code/docs/core/TESTING_GUIDE.md's marker taxonomy documentation). Mirrors oracle/conftest.py's identically-named marker for the oracle suite's own parallel/serial split.",
    "development: Tests belonging to a theory still under active construction (e.g. bimodal), whose current failure is expected and tracked rather than a regression. Deselected from gating runs with `-m \"not development\"`. Distinct from `unstable` (an investigated, non-semantic instability in an otherwise-complete theory) and from `xdist_serial` (a routine contention classification). See code/docs/core/TESTING_GUIDE.md section 8.14. Mirrored into oracle/conftest.py, which applies it as a tree-level blanket EXCEPT to the differential/soundness core (the six classes differential-tests.yml's gate step names by node id) -- so the harness's completeness claims are non-gating while its soundness claims stay fully gating.",
]
filterwarnings = [
    # Ignore deprecation warning from z3's use of pkg_resources
    # This is a third-party library issue that will be fixed upstream
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning:z3.z3core",
    # Also ignore if it comes without specific module attribution
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]
